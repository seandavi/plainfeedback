[project]
name = "plainfeedback"
version = "0.1.0"
description = "De-identified event-feedback surveys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2.4", "jinja2>=3.1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plainfeedback"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
