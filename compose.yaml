services:
  app:
    build: .
    ports:
      # Loopback by default: production traffic must come through the TLS reverse proxy (docs/deploy.md).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      # POSTGRES_PASSWORD default is for local dev only; set a real one via .env or the environment.
      DATABASE_URL: postgresql://plainfeedback:${POSTGRES_PASSWORD:-plainfeedback-dev-only}@db:5432/plainfeedback
      # Staff auth (docs/deploy-auth.md). Passed through from the deploy shell; unset = auth disabled.
      OIDC_PROVIDER:
      OIDC_ISSUER:
      OIDC_CLIENT_ID:
      OIDC_CLIENT_SECRET:
      OIDC_REDIRECT_URI:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ALLOWED_EMAIL_DOMAINS:
      ADMIN_EMAILS:
      COOKIE_SECURE:
      SESSION_TTL_HOURS:
      SESSION_IDLE_HOURS:
      # Participant rate limits (docs/deploy.md#client-address-and-rate-limits).
      TRUST_PROXY:
      RATE_LIMIT_SURVEY_BURST:
      RATE_LIMIT_SURVEY_PER_SECOND:
      RATE_LIMIT_CLIENT_MAX:
      RATE_LIMIT_CLIENT_WINDOW_MINUTES:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plainfeedback
      POSTGRES_DB: plainfeedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plainfeedback-dev-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainfeedback -d plainfeedback"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
